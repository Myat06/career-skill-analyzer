# Skill-gap matching engine eval set.
#
# The regression tests in tests/integration/test_gap_engine_calibration.py
# only check that an unrelated student scores low and a related one scores
# meaningfully higher, with generous margins -- a guard against a broken
# engine, not a real accuracy measurement. This file is the harness for that
# real measurement: each entry pairs a real seeded fixture student against a
# real curated role, with one `expected_status` per required unit, to be
# filled in by someone with actual standing to judge it -- an IS-program
# advisor, or Sir Ronny (the stakeholder this tool was built for) -- not
# invented here. Every expected_status below starts `null` (TODO).
# tests/integration/test_skill_gap_eval_set.py skips any entry where a unit
# is still null, so this file ships usable at zero labels and can be filled
# in incrementally without ever failing CI on an unlabeled row.
#
# IMPORTANT, found while building this: the live dev database has already
# drifted from data/seed/activities.yaml. Sari Wulandari (S2023001) and Budi
# Santoso (S2022014) both have activities defined in that YAML (a Kaggle-
# style competition placement, a Google certificate, an SAP certification,
# an ERP internship) that are NOT actually present as Activity rows in the
# live DB right now -- and Myat Min Thu (S2023100) has a real "WasteIQ"
# activity that exists ONLY in the live DB, added through actual use of the
# app, not from any seed file. So: do not trust this file's `notes` field,
# or activities.yaml, as ground truth for what evidence a student currently
# has -- query the live DB (or GET /students/{id}/activities) at labeling
# time and treat whatever it says as current. The notes below describe the
# live DB state as verified at the time this file was written, not the
# seed fixture's intent, and may go stale again the same way.
#
# To label an entry: read the student's ACTUAL CURRENT completed courses
# and logged activities (query the live DB directly, or GET
# /students/{id}/activities and .../enrollments -- not the seed YAML files,
# see above) and/or resume if one exists, read the role's required SKKNI
# units' real meaning (SKKNI_2026-103.pdf / app/scoring/skkni_titles.py's
# English translations), and judge independently whether that student's
# real evidence demonstrates each unit -- "matched" | "partial" | "missing"
# -- THEN compare against what the engine actually produced (GET
# /students/{id}/analyzer/skill-gap, or a script calling
# app.scoring.gap_engine.analyze_skill_gap directly). Judge first, look
# second -- labeling with the engine's own answer already in view defeats
# the point of an independent check. Record reviewed_by/reviewed_at once
# done.
#
# Sampling rationale for the 9 pairs below (chosen to span real variation the
# engine has to handle correctly, not selected to make it look good):
# - Every one of the 6 curated roles appears at least once.
# - A mix of evidence shapes: pairs that are course-only right now (no
#   activities in the live DB at all), one with genuinely rich activity
#   evidence (multiple real projects/certifications), and one genuine
#   cross-domain mismatch (an ERP/SAP-focused transcript against AI-specific
#   roles -- a real "should mostly score low" case, not a synthetic one).
# - Different cohort years (2022 and 2023), so course-completion coverage
#   varies naturally rather than every fixture being a late-stage student.

